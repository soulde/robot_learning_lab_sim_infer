      name: policy_1
      # Set to the policy checkpoint when replacing the observe/infer stub.
      policy_file: null
      kp: 12.0
      kd: 0.8
    - index: 2
      name: policy_2
      policy_file: null
      kp: 20.0
      kd: 1.2
