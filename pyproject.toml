[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2sim"
version = "0.1.0"
description = "Sim-to-sim policy validation with deploy.json configuration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Soulde Developers"},
]
keywords = ["robotics", "sim2sim", "mujoco", "policy-validation", "torque-control"]
dependencies = [
    "numpy>=1.23",
    "jsonschema>=4.0",
]

[project.urls]
Repository = "https://github.com/soulde/sim2sim"

[project.optional-dependencies]
mujoco = ["mujoco>=3.1.0"]
rll_rl = ["rll_rl"]
all = [
    "mujoco>=3.1.0",
    "rll_rl",
]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
sim2sim = "sim2sim.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E402",   # Module level import not at top of file
    "RET504", # Unnecessary variable assignment before return statement
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
