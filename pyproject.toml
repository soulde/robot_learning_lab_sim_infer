[project]
name = "robot-learning-lab-sim-infer"
version = "0.1.0"
description = "Generic TorchScript MuJoCo sim2sim runner"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mujoco>=3.1,<4",
    "numpy>=1.24,<3",
    "torch>=2.0,<3",
]

[project.optional-dependencies]
dds = ["cyclonedds>=0.10"]
viser = ["viser>=0.2"]
sim-hardware = ["cyclonedds>=0.10", "hydra-core>=1.3,<2", "mjviser>=0.0.14"]

[project.scripts]
robot-learning-lab-sim-infer = "robot_learning_lab_sim_infer.main:main"
rll-sim-hardware = "robot_learning_lab_sim_infer.nodes.sim_hardware_node:main"
rll-dummy-control = "robot_learning_lab_sim_infer.nodes.dummy_control_node:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_learning_lab_sim_infer = ["configs/*.yaml", "dds/idl/*.idl", "assets/dr02_motor/*.xml", "assets/dr02_motor/*.md", "assets/dr02_motor/meshes/*.STL"]
