[project]
name = "robot-learning-lab-sim-infer"
version = "0.1.0"
description = "Generic TorchScript MuJoCo sim2sim runner"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mujoco>=3.1,<4",
    "numpy>=1.24,<3",
    "torch>=2.0,<3",
]

[project.scripts]
robot-learning-lab-sim-infer = "robot_learning_lab_sim_infer.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
