# Chocolate 23-DoF example. External checkpoints and motion data are not bundled.
dds:
  domain_id: 23
  cyclonedds_uri: null
  state_topic: robot/state
  rc_topic: robot/rc_command
  motor_command_topic: robot/motor_command
  sensor_reliability: best_effort
  command_reliability: reliable

timing:
  policy_hz: 50.0
  state_timeout_s: 0.25
  rc_timeout_s: 0.5
  transition_duration_s: 0.5

device: cpu

plugin:
  path: ../../build-cpp/libchocolate_robot_plugin.so
  config: chocolate_plugin.yaml

damping:
  kd: 0.5

policies:
  - index: 1
    type: velocity
    name: velocity
    checkpoint: ~/chocolate_training/.pretrained_checkpoints/sim2sim/velocity_policy_model_18600.pt
    observation_dim: 78
    action_dim: 23
  - index: 2
    type: tracking
    name: tracking
    checkpoint: ~/chocolate_training/logs/rsl_rl/chocolate_tracking/2026-10-01_15-59-07_dance2_subject1_manual_offsets_20261001/exported/policy.pt
    observation_dim: 124
    action_dim: 23

state_machine:
  initial_state: damping
  states:
    damping:
      policy: null
      transitions: {select_damping: damping, select_velocity: velocity, select_tracking: tracking, select_fix: fix}
    velocity:
      policy: velocity
      transitions: {select_damping: damping, select_velocity: velocity, select_tracking: tracking, select_fix: fix}
    tracking:
      policy: tracking
      transitions: {select_damping: damping, select_velocity: velocity, select_tracking: tracking, select_fix: fix}
    fix:
      policy: null
      command: fixed_pose
      transitions: {select_damping: damping, select_velocity: velocity, select_tracking: tracking, select_fix: fix}
  mode_events:
    0: select_damping
    1: select_velocity
    2: select_tracking
    3: select_fix
  button_events: {}
