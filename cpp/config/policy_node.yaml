# Generic native policy-node example. Replace the paths with an exported
# TorchScript model, a robot plugin shared library, and its plugin config.
dds:
  domain_id: 23
  cyclonedds_uri: null
  state_topic: robot/state
  rc_topic: robot/rc_command
  motor_command_topic: robot/motor_command
  sensor_reliability: best_effort
  command_reliability: reliable

timing:
  policy_hz: 50.0
  state_timeout_s: 0.25
  rc_timeout_s: 0.5
  transition_duration_s: 0.5

device: cpu

plugin:
  path: ./librobot_plugin.so
  config: ./robot_plugin.yaml

damping:
  kd: 0.5

policies:
  - index: 1
    type: velocity
    name: walk
    checkpoint: ./walk_policy.pt
    observation_dim: 78
    action_dim: 12

state_machine:
  initial_state: damping
  states:
    damping:
      policy: null
      transitions: {select_damping: damping, select_walk: walk}
    walk:
      policy: walk
      transitions: {select_damping: damping, select_walk: walk}
  mode_events:
    0: select_damping
    1: select_walk
  button_events: {}
